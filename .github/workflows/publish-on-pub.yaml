name: Publish package to pub.dev
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
jobs:
  # The tag can be pushed before the CI of its commit has finished.
  test:
    uses: ./.github/workflows/analyze-and-test.yaml
  publish:
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
