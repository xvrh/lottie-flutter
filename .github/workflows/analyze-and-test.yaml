name: Lottie Flutter
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  analyze_and_test:
    name: Flutter analyze
    # Native arm64 (free for public repos) so golden rendering matches what the
    # maintainer generates locally on Apple Silicon — no QEMU emulation drift.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Golden tests render inside this pinned, self-built Flutter image (Debian
      # + the official Flutter SDK) so output is reproducible regardless of host
      # OS. Regenerate goldens locally with the same image via
      # `tool/docker_test.sh --update-goldens`.
      - uses: docker/setup-buildx-action@v3
      - name: Build Flutter image
        uses: docker/build-push-action@v6
        with:
          context: tool/ci
          load: true
          tags: lottie-flutter-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyze and test
        run: |
          docker run --rm -v "$PWD":/app -w /app lottie-flutter-ci bash -c '
            set -e
            flutter --version
            flutter pub get
            flutter analyze
            flutter test
            (cd example && flutter pub get && flutter test)
            flutter pub run tool/prepare_submit.dart
            git diff --exit-code --stat -- . ":(exclude)*pubspec.lock" \
              || (echo "##[error] found changed files after build. please run \"dart tool/prepare_submit.dart\" and check in all changes" && exit 1)
          '
  build_web_version:
    name: Check that the web version can compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter precache web
      - run: flutter pub get
      - run: flutter build web
        working-directory: example
